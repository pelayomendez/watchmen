<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="watchmen">
  <!-- An original hydrogen atom: one nucleus, one tilted orbit, one electron. The __TOKENS__ are
       filled in at render time with the watch's state colours (hooks/board.ts, paintAtom). -->
  <ellipse cx="32" cy="32" rx="27" ry="11" transform="rotate(-30 32 32)" fill="none" stroke="__ORBIT__" stroke-width="2.5" opacity="0.85"/>
  <circle cx="32" cy="32" r="6" fill="__NUCLEUS__"/>
  <circle cx="54.4" cy="19.5" r="4.5" fill="__ELECTRON__"/>
</svg>
