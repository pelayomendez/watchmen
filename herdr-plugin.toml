# watchmen as a herdr plugin: the watchmen session summoned beside whatever tab you are on, and
# the read-only board list as a secondary split. No build step: the viewer is a Node script with no dependencies.

id = "watchmen"
name = "watchmen"
version = "0.2.0"
description = "The watch board: what needs you, what is moving, what is waiting, beside your sessions."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[panes]]
id = "board"
title = "⚛ watchmen"
placement = "split"
command = ["node", "bin/watchmen-board"]

# The action to bind: the watchmen session itself, summoned beside you from any tab and sent back
# to a tab of its own on a second press, still running.
[[actions]]
id = "summon"
platforms = ["linux", "macos"]
title = "Summon the watch"
description = "Bring the watchmen session beside the current pane, start it if none runs, or send it back to its own tab."
command = ["bash", "scripts/herdr-summon.sh"]

# Secondary: the read-only board list in a split.
[[actions]]
id = "toggle-board"
platforms = ["linux", "macos"]
title = "Toggle the watch board"
description = "Open the watch board beside the current pane, focus it, or close it."
command = ["bash", "scripts/herdr-toggle-board.sh"]
